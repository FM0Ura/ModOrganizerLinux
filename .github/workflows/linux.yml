name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out superproject
        uses: actions/checkout@v4
        with:
          path: ModOrganizerLinux

      - name: Build container image
        run: docker build -t mo2-linux-build -f ModOrganizerLinux/build/Containerfile ModOrganizerLinux/build

      # --tests also runs the unit tests of every target and the smoke test of the
      # application (build.sh smoke_modorganizer)
      - name: Build and test
        run: |
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined -e MO2_REQUIRE_FUSE=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work/ModOrganizerLinux \
            mo2-linux-build ./build.sh --tests

      # the installed application prints its usage, and starts headless (fresh HOME, no
      # instance) up to the instance selection without crashing
      - name: Smoke test
        run: |
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined -e MO2_REQUIRE_FUSE=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work/ModOrganizerLinux \
            mo2-linux-build tests/smoke/modorganizer-smoke.sh install

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: mo2-linux-install
          path: ModOrganizerLinux/install/
          if-no-files-found: error
