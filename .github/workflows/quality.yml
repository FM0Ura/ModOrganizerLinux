name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Hooks and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install hooks
        run: python -m pip install -r tools/quality/requirements.txt
      - name: Check workflows
        run: pre-commit run actionlint --all-files --show-diff-on-failure
      - name: Check changed files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SKIP: actionlint,gitleaks
        run: |
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree -w /dev/null)"
          fi
          pre-commit run --from-ref "$BASE" --to-ref HEAD --show-diff-on-failure
      - name: Scan commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            "$GOBIN/gitleaks" git --redact --log-opts="$BASE..HEAD"
          else
            "$GOBIN/gitleaks" git --redact --log-opts=HEAD
          fi

  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - deps/basic_games/plugin-requirements.txt
          - deps/installer_wizard/plugin-requirements.txt
          - deps/plugin_ai_assistant/plugin-requirements.txt
          - tools/quality/requirements.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Audit direct and transitive dependencies
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          python -m pip install -r tools/quality/requirements.txt
          pip-audit --strict -r "$MANIFEST"

  pyright:
    name: Pyright (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install assistant dependencies
        run: python -m pip install -r deps/plugin_ai_assistant/plugin-requirements.txt
      - name: Type-check the AI Assistant
        # The existing plugin has typing errors and imports the native mobase module.
        continue-on-error: true
        run: npm exec --yes --package=pyright@1.1.407 -- pyright --pythonpath "$(command -v python)"

  rust:
    name: Rust formatting and Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mo2-vfs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings

  rust-audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit the VFS lockfile
        run: |
          cargo +stable install cargo-audit --locked --version 0.23.0
          cargo audit --file mo2-vfs/Cargo.lock

  docs:
    name: MkDocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/quality/requirements.txt
      - run: mkdocs build --strict
